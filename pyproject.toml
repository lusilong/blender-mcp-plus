[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "blender-mcp-plus"
version = "1.0.3"
description = "MCP server for Blender: official Blender Lab tools plus a Poly Haven asset library"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [
    { name = "blender-mcp-plus contributors" },
]
keywords = [
    "blender",
    "mcp",
    "model-context-protocol",
    "3d",
    "polyhaven",
    "ai",
    "agent",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Graphics :: 3D Modeling",
]
dependencies = [
    "docutils",
    "mcp[cli]>=1.2.0,<2",
    "pyyaml",
]

[project.optional-dependencies]
dev = [
    "build",
    "twine",
    "pytest",
]

[project.urls]
Homepage = "https://github.com/lusilong/blender-mcp-plus"
Repository = "https://github.com/lusilong/blender-mcp-plus"
Issues = "https://github.com/lusilong/blender-mcp-plus/issues"
Upstream = "https://projects.blender.org/lab/blender_mcp"

[project.scripts]
blender-mcp-plus = "blender_mcp_plus:main"

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools.package-data]
"blender_mcp_plus" = [
    # MCP prompt definitions.
    "data/prompts.yml",
    # Blender Python API reference.
    "data/api/**/*.rst",
    # Blender user manual.
    "data/manual/**/*.rst",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
extend-exclude = ["blender_mcp_plus/data"]

[tool.ruff.lint]
ignore = [
    "UP032",
    "BLE001",
    "SIM102",
    "SIM114",
    "RUF023",
]

[tool.pylint.format]
max-line-length = 120
